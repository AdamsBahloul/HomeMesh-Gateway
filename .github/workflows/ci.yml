name: SmartBridge OS CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-build-and-test:
    name: Build STM32 Firmware & Run C17 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm Toolchain & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake build-essential

      - name: Compile C17 Protocol Unit Tests
        run: |
          gcc -I firmware/Core/Inc tests/firmware/test_protocol.c firmware/Core/Src/protocol.c -o test_protocol
          ./test_protocol

      - name: Build Firmware Binary via CMake
        run: |
          cd firmware
          mkdir build && cd build
          cmake ..
          make

  backend-tests:
    name: Run FastAPI Backend Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r linux-gateway/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/
          python tests/integration/test_end_to_end.py

  frontend-build:
    name: Build React 18 TypeScript Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Vite Production Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartbridge-dashboard-dist
          path: frontend/dist/
          retention-days: 7
