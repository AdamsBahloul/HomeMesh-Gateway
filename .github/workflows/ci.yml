name: SmartBridge OS CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-build-and-test:
    name: Build STM32 Firmware & Run C17 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Arm Toolchain & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake build-essential

      - name: Compile C17 Protocol Unit Tests
        run: |
          gcc -I firmware/Core/Inc tests/firmware/test_protocol.c firmware/Core/Src/protocol.c -o test_protocol
          ./test_protocol

      - name: Build Firmware Binary via CMake
        run: |
          cd firmware
          mkdir build && cd build
          cmake ..
          make

  backend-tests:
    name: Run FastAPI Backend Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r linux-gateway/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/
          python tests/integration/test_end_to_end.py

  frontend-build:
    name: Build React 18 TypeScript Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
