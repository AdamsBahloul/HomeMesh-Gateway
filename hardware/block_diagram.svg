<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0B0F19"/>
  <rect x="50" y="50" width="220" height="300" rx="12" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  <text x="160" y="80" fill="#06B6D4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Raspberry Pi 5</text>
  <text x="160" y="100" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Embedded Linux Gateway</text>
  
  <rect x="70" y="130" width="180" height="40" rx="6" fill="#1F2937"/>
  <text x="160" y="155" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">Linux Gateway Daemon</text>
  
  <rect x="70" y="190" width="180" height="40" rx="6" fill="#1F2937"/>
  <text x="160" y="215" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">Mosquitto TLS Broker</text>
  
  <rect x="70" y="250" width="180" height="40" rx="6" fill="#1F2937"/>
  <text x="160" y="275" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">FastAPI Backend Engine</text>
  
  <!-- Serial Bus Connection -->
  <line x1="270" y1="200" x2="500" y2="200" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="385" y="190" fill="#06B6D4" font-family="sans-serif" font-size="12" text-anchor="middle">UART / RS485 (Custom Binary)</text>
  
  <rect x="500" y="50" width="250" height="300" rx="12" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  <text x="625" y="80" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">STM32 Microcontroller Array</text>
  
  <rect x="525" y="120" width="200" height="50" rx="6" fill="#1F2937"/>
  <text x="625" y="150" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">STM32 Node #1 (FreeRTOS)</text>
  
  <rect x="525" y="190" width="200" height="50" rx="6" fill="#1F2937"/>
  <text x="625" y="220" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">STM32 Node #2 (FreeRTOS)</text>

  <rect x="525" y="260" width="200" height="50" rx="6" fill="#1F2937"/>
  <text x="625" y="290" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle">STM32 Node #3 (FreeRTOS)</text>
</svg>
